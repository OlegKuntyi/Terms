<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MedTerms · Lehrerbereich</title>
<link rel="icon" href="../favicon-32.png">
<style>
  :root{
    --bg:#F7F9FC;--card:#FFFFFF;--sel:#EEF2F7;--prog:#E5E8EE;
    --t1:#242833;--t2:#7E8494;--t3:#959FBA;--sep:#D3D7E0;
    --ink:#14171C;--on-ink:#FFFFFF;--ok:#1E9E63;--err:#D64545;--warn:#C98A12;
    --r:16px;--rb:12px;--rs:8px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0E1116;--card:#171A21;--sel:#1F2937;--prog:#2A2F3A;
      --t1:#E6E8EE;--t2:#A1A7B5;--t3:#737A8A;--sep:#2E3341;--ink:#E9ECF2;--on-ink:#0E1116;}
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--t1);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--sep);background:var(--card);position:sticky;top:0;z-index:5}
  header .brand{font-weight:800;letter-spacing:-.01em}
  header nav{display:flex;gap:4px}
  header nav button{background:none;border:0;padding:8px 12px;border-radius:var(--rb);color:var(--t2);font-weight:600;cursor:pointer}
  header nav button.on{background:var(--sel);color:var(--t1)}
  header .me{margin-left:auto;color:var(--t2);font-size:13px;display:flex;align-items:center;gap:10px}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
  .card{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .lbl{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
  .lbl:first-child{margin-top:0}
  .lbl .tr{color:var(--t3);letter-spacing:0;text-transform:none;font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--sep);background:var(--card);border-radius:var(--rb);padding:9px 14px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--sel)}
  .btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink);height:44px;padding:0 20px}
  .btn.primary:disabled{opacity:.45;cursor:default}
  .btn.ghost{border-color:transparent;color:var(--t2)}
  .btn.danger{color:var(--err)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .tile{cursor:pointer}
  .tile:hover{border-color:var(--t3)}
  .tile h3{margin:0 0 6px;font-size:16px}
  .meta{color:var(--t3);font-size:12.5px;font-weight:600}
  .chip{display:inline-block;padding:2px 8px;border-radius:var(--rs);background:var(--prog);color:var(--t2);font-size:11px;font-weight:800}
  .chip.ok{background:rgba(30,158,99,.14);color:var(--ok)}
  .chip.warn{background:rgba(201,138,18,.14);color:var(--warn)}
  .chip.ink{background:var(--ink);color:var(--on-ink)}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--card);border:1px solid var(--sep);border-radius:var(--rb);padding:10px 12px;outline:0}
  input:focus,select:focus,textarea:focus{border-color:var(--ink)}
  label.f{display:block;margin-bottom:10px}
  label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--sep);font-size:14px;vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--t2)}
  tr:last-child td{border-bottom:0}
  .bar{height:6px;background:var(--prog);border-radius:999px;overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--ink)}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;letter-spacing:.18em;font-size:22px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid var(--sep);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
  .chips button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .hint{color:var(--t2);font-size:13px;margin:4px 0 0}
  .cat{border:1px solid var(--sep);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
  .cat>.h{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-weight:700}
  .cat>.h .n{margin-left:auto;color:var(--t3);font-size:12px;font-weight:700}
  .cat>.h input.ca{width:18px;height:18px;accent-color:var(--ink);cursor:pointer}
  .cat .b input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink)}
  .cat>.b{display:none;padding:4px 10px 10px}
  .cat.open>.b{display:block}
  .cat .b label{display:flex;gap:10px;align-items:center;padding:5px 6px;font-size:14px;cursor:pointer}
  .ord{list-style:none;margin:0;padding:0}
  .ord li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--sep);font-size:14px}
  .ord li:last-child{border-bottom:0}
  .ord li .i{width:26px;color:var(--t3);font-size:12px;font-weight:700}
  .ord li .t{flex:1}
  .ord li button{border:0;background:none;cursor:pointer;color:var(--t2);padding:2px 6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:var(--rb);font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .center .card{max-width:420px}
  .sp{width:18px;height:18px;border:2px solid var(--sep);border-top-color:var(--ink);border-radius:50%;animation:r 1s linear infinite;display:inline-block}
  @keyframes r{to{transform:rotate(360deg)}}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:720px){.two{grid-template-columns:1fr}header{padding:12px 14px}main{padding:16px 12px 60px}}

  /* ---- full-screen plan editor ---- */
  body.wide main{max-width:none;padding:0 0 40px}
  .edbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--sep);background:var(--card);position:sticky;top:57px;z-index:4}
  .edtitle{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed{display:grid;grid-template-columns:minmax(440px,34%) minmax(0,1fr);gap:0;min-height:calc(100vh - 120px)}
  .edleft{padding:16px;border-right:1px solid var(--sep);background:var(--bg);position:sticky;top:106px;max-height:calc(100vh - 106px);overflow:auto;align-self:start}
  .edleft .card{padding:14px 16px;margin-bottom:10px}
  .edleft .catalog{max-height:none}
  .edright{padding:16px 24px;min-width:0}
  .planhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .tile2{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--sep);border-radius:var(--rb);padding:12px 10px 12px 14px;cursor:grab;user-select:none;min-height:64px}
  .tile2:active{cursor:grabbing}
  .tile2.drag{opacity:.4;border-style:dashed;border-color:var(--ink);background:var(--sel);transform:scale(.98)}
  .tiles.dragging .tile2{transition:transform .12s ease}
  .tile2 .n.changed{background:var(--ink);color:var(--on-ink)}
  .tile2.custom{border-style:dashed}
  .tile2 .n{width:26px;height:26px;border-radius:8px;background:var(--sel);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--t2);flex:none}
  .tile2 .tt{flex:1;min-width:0}
  .tile2 .t{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tile2 .s{font-size:11px;color:var(--t3);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile2 .x{border:0;background:none;color:var(--t3);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px;flex:none}
  .tile2 .x:hover{background:var(--sel);color:var(--err)}
  .cat .b label.on{color:var(--t1);font-weight:600}
  .cat .b label{padding:4px 6px;font-size:13.5px}
  .cat>.h{padding:8px 12px;font-size:14px}
  @media (max-width:900px){.ed{grid-template-columns:1fr}.edleft{border-right:0;border-bottom:1px solid var(--sep);position:static;max-height:none}.edbar{top:49px;flex-wrap:wrap}.tiles{grid-template-columns:1fr}}
  .hero{background:linear-gradient(135deg,#14171C,#2A2F3A);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
  .hero h2{margin:0 0 4px;font-size:20px}
  .hero p{margin:0;color:rgba(255,255,255,.72);font-size:13.5px}
  .empty{color:var(--t2);padding:18px 0;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .kv b{color:var(--t2);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand">MedTerms · Lehrerbereich</div>
  <nav id="nav" hidden>
    <button data-v="groups" class="on">Gruppen</button>
    <button data-v="plans">Pläne</button>
  </nav>
  <div class="me" id="me"></div>
</header>
<main id="app"><div class="center"><span class="sp"></span></div></main>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import QRCode from 'https://esm.sh/qrcode@1.5.4';

const SUPABASE_URL = 'https://dnngjjfipppdjrgmmjxo.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubmdqamZpcHBwZGpyZ21tanhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNTczNzgsImV4cCI6MjA5MTczMzM3OH0.OMdU8wrV6evjoYEd9i1CYIXcPbSx0D4f4XgW-j0MiCM';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

const REGIONS = ['Bayern','Berlin','Brandenburg','Bremen','Hamburg','Hessen','Mecklenburg-Vorpommern','Niedersachsen','Nordrhein-Westfalen','Rheinland-Pfalz','Saarland','Sachsen','Sachsen-Anhalt','Schleswig-Holstein','Thüringen','Baden-Württemberg-Freiburg','Baden-Württemberg-Karlsruhe','Baden-Württemberg-Stuttgart','Baden-Württemberg-Reutlingen','Westfalen-Lippe'];
const CUSTOM = 'custom::';
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = s => { if(!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('de-DE'); };
const iso = d => d.toISOString().slice(0,10);
const human = p => p.replace(/[_-]/g,' ').split(' ').map(w => w ? w[0].toLocaleUpperCase('de') + w.slice(1) : w).join(' ');
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); };

let manifest = null, regionCases = null;
async function data(){
  if(!manifest){ manifest = await (await fetch('data/kp_plan_topics_manifest.json')).json(); }
  if(!regionCases){ regionCases = await (await fetch('data/region_cases.json')).json(); }
}
const fspKeyFor = label => { if(!label) return null; const keys = Object.keys(regionCases.regions||{}); if(keys.includes(label)) return label; if(label.startsWith('Baden-Württemberg')) return keys.find(k=>k.startsWith('Baden-Württemberg'))||null; return null; };
const diagnosesFor = key => { const v=(regionCases.regions||{})[key]; return Array.isArray(v)? v.map(x=> typeof x==='string'? x : (x.name||x.title||String(x))) : []; };

// ---------------------------------------------------------------- auth
let me = null, role = '';
async function boot(){
  const m = location.hash.match(/th=([A-Za-z0-9_\-\.]+)/);
  if(m){
    history.replaceState(null,'',location.pathname);
    const { error } = await sb.auth.verifyOtp({ type:'magiclink', token_hash:m[1] });
    if(error){ return loginView('Der QR-Link ist abgelaufen oder wurde schon benutzt. In der App einen neuen erzeugen.'); }
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return loginView();
  me = session.user; role = me.user_metadata?.role || '';
  if(!['teacher','author'].includes(role)) return loginView('Dieses Konto hat keine Lehrer-/Autorenrolle.');
  $('#me').innerHTML = `<span>${esc(me.email)}</span><span class="chip ink">${role==='teacher'?'Lehrer':'Autor'}</span><button class="btn sm ghost" id="out">Abmelden</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('#nav').hidden = false;
  for(const b of $('#nav').querySelectorAll('button')) b.onclick = () => { for(const x of $('#nav').querySelectorAll('button')) x.classList.toggle('on', x===b); route(b.dataset.v); };
  await data();
  route(role==='teacher' ? 'groups' : 'plans');
  if(role!=='teacher'){ $('#nav button[data-v=groups]').hidden = true; $('#nav button[data-v=plans]').classList.add('on'); }
}
let qrTimer = null, pollTimer = null;
async function fn(action, payload={}){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/web-login`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON, 'Authorization':`Bearer ${SUPABASE_ANON}`, 'Content-Type':'application/json' }, body: JSON.stringify({ action, ...payload }) });
  return r.json();
}
function loginView(msg){
  $('#nav').hidden = true; clearTimeout(qrTimer); clearTimeout(pollTimer);
  app.innerHTML = `<div class="center"><div class="card" style="max-width:460px">
    <h2 style="margin:0 0 6px">Mit der App anmelden</h2>
    <p class="hint" style="font-size:14px;margin-bottom:14px">In der MedTerms-App: <b>Einstellungen → Web-Dashboard → QR-Code scannen</b> (oder im Lehrerbereich das Laptop-Symbol).</p>
    <div id="qrbox" style="display:flex;justify-content:center;align-items:center;min-height:260px"><span class="sp"></span></div>
    <p class="hint" id="qrstate" style="margin-top:10px"></p>
    ${msg?`<p style="color:var(--err);font-weight:600;margin-top:12px">${esc(msg)}</p>`:''}
    <p class="hint" style="margin-top:14px">Der Code ist 5 Minuten gültig und meldet genau das Konto an, mit dem du scannst. Keine Passwörter, keine dauerhaften Codes.</p>
  </div></div>`;
  startQr();
}
async function startQr(){
  const box = $('#qrbox'), st = $('#qrstate'); if(!box) return;
  let s; try { s = await fn('create'); } catch(e){ st.textContent = 'Verbindung fehlgeschlagen.'; return; }
  if(!s?.sid){ st.textContent = 'Konnte keinen Code erzeugen.'; return; }
  const payload = `https://medterms.app/web-login?sid=${s.sid}`;
  const url = await QRCode.toDataURL(payload, { width: 260, margin: 1, errorCorrectionLevel: 'M', color: { dark: '#14171C', light: '#FFFFFF' } });
  box.innerHTML = `<img src="${url}" width="260" height="260" alt="QR" style="border-radius:12px;background:#fff">`;
  const until = Date.now() + (s.expires_in||300)*1000;
  const tick = async () => {
    if(!document.body.contains(box)) return;
    if(Date.now() > until){ st.innerHTML = 'Abgelaufen. <a href="#" id="renew">Neuen Code erzeugen</a>'; box.style.opacity = .25; $('#renew').onclick = e => { e.preventDefault(); box.style.opacity = 1; box.innerHTML = '<span class="sp"></span>'; st.textContent=''; startQr(); }; return; }
    st.textContent = `Warte auf Bestätigung in der App… (${Math.max(0,Math.round((until-Date.now())/1000))} s)`;
    try {
      const r = await fn('poll', { sid: s.sid, poll_secret: s.poll_secret });
      if(r.status === 'approved' && r.token_hash){
        st.textContent = 'Bestätigt — melde an…';
        const { error } = await sb.auth.verifyOtp({ type:'magiclink', token_hash: r.token_hash });
        if(error){ st.textContent = 'Anmeldung fehlgeschlagen: ' + error.message; return; }
        location.reload(); return;
      }
      if(r.status === 'gone' || r.status === 'expired'){ st.innerHTML = 'Abgelaufen. <a href="#" id="renew">Neuen Code erzeugen</a>'; $('#renew').onclick = e => { e.preventDefault(); box.innerHTML = '<span class="sp"></span>'; st.textContent=''; startQr(); }; return; }
    } catch(_) {}
    pollTimer = setTimeout(tick, 2000);
  };
  tick();
}

// ---------------------------------------------------------------- routing
let view = 'groups';
function route(v, arg){ view = v; if(v!=='plan') document.body.classList.remove('wide'); if(v==='groups') groupsView(); else if(v==='group') groupView(arg); else if(v==='plans') plansView(); else if(v==='plan') planEditor(arg); }

// ---------------------------------------------------------------- groups
async function groupsView(){
  app.innerHTML = `<div class="hero"><h2>Meine Gruppen</h2><p>Einladungscode teilen, Fortschritt sehen, Aufgaben & Pläne schicken.</p></div>
    <div class="row" style="margin-bottom:14px"><button class="btn primary" id="new">+ Neue Gruppe</button></div><div id="list"><span class="sp"></span></div>`;
  $('#new').onclick = createGroupDialog;
  const { data, error } = await sb.from('teacher_groups').select().eq('teacher_id', me.id).order('created_at');
  if(error) return $('#list').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  if(!data.length) return $('#list').innerHTML = `<div class="empty">Noch keine Gruppe. Lege eine an und teile den Code mit deinen Teilnehmern.</div>`;
  $('#list').innerHTML = `<div class="grid">${data.map(g=>{
    const exp = g.expires_at ? new Date(g.expires_at) : null; const expired = exp && exp < new Date();
    return `<div class="card tile" data-id="${g.id}"><h3>${esc(g.name)}</h3><div class="row"><span class="code">${esc(g.invite_code)}</span>${expired?'<span class="chip warn">beendet</span>':''}</div>
      <div class="meta" style="margin-top:6px">${exp?`bis ${fmtD(g.expires_at)}`:'unbefristet'}</div></div>`; }).join('')}</div>`;
  for(const t of app.querySelectorAll('.tile')) t.onclick = () => route('group', t.dataset.id);
}
function createGroupDialog(){
  app.insertAdjacentHTML('afterbegin', `<div class="card" id="dlg"><div class="lbl">Neue Gruppe</div>
    <label class="f"><span>Name</span><input type="text" id="gname" placeholder="z. B. KP Mai 2027 — Gruppe A"></label>
    <label class="f"><span>Laufzeit</span><div class="chips" id="dur">${[1,3,6,12].map(m=>`<button data-m="${m}" ${m===3?'class="on"':''}>${m} Monate</button>`).join('')}<button data-m="0">unbefristet</button></div></label>
    <div class="row"><button class="btn primary" id="ok">Anlegen</button><button class="btn ghost" id="no">Abbrechen</button></div></div>`);
  let months = 3;
  for(const b of $('#dur').querySelectorAll('button')) b.onclick = () => { months = +b.dataset.m; for(const x of $('#dur').querySelectorAll('button')) x.classList.toggle('on', x===b); };
  $('#no').onclick = () => $('#dlg').remove();
  $('#ok').onclick = async () => {
    const name = $('#gname').value.trim(); if(!name) return;
    let expires_at = null; if(months){ const d=new Date(); d.setMonth(d.getMonth()+months); expires_at = d.toISOString(); }
    const { data, error } = await sb.from('teacher_groups').insert({ teacher_id: me.id, name, expires_at }).select().single();
    if(error) return toast(error.message);
    toast('Gruppe angelegt'); route('group', data.id);
  };
}
async function groupView(id){
  app.innerHTML = `<span class="sp"></span>`;
  const [{ data:g, error:e1 }, { data:prog }, { data:asg }, { data:plans }] = await Promise.all([
    sb.from('teacher_groups').select().eq('id', id).single(),
    sb.rpc('teacher_group_progress', { p_group: id }),
    sb.from('teacher_assignments').select().eq('group_id', id).order('created_at', { ascending:false }),
    sb.from('author_plans').select('id,title,exam,published,visibility').eq('author_id', me.id).eq('published', true).order('updated_at', { ascending:false }),
  ]);
  if(e1||!g) return app.innerHTML = `<div class="empty">${esc(e1?.message||'Nicht gefunden')}</div>`;
  const exp = g.expires_at ? new Date(g.expires_at) : null; const expired = exp && exp < new Date();
  const link = `https://medterms.app/join?code=${g.invite_code}`;
  const rows = (prog||[]);
  app.innerHTML = `
    <div class="row" style="margin-bottom:10px"><button class="btn ghost" id="back">← Gruppen</button></div>
    <div class="hero"><h2>${esc(g.name)}</h2><p>${rows.length} Teilnehmer · ${exp?`läuft bis ${fmtD(g.expires_at)}`:'unbefristet'} ${expired?'· <b>beendet</b>':''}</p></div>
    <div class="two">
      <div class="card"><div class="lbl">Einladung</div>
        <div class="row"><span class="code">${esc(g.invite_code)}</span><button class="btn sm" id="cpc">Code kopieren</button><button class="btn sm" id="cpl">Link kopieren</button></div>

  for(const b of app.querySelectorAll('.rm')) b.onclick = async () => { if(!confirm('Teilnehmer aus der Gruppe entfernen?')) return; const { error } = await sb.from('teacher_group_members').delete().eq('group_id', id).eq('student_id', b.dataset.s); if(error) return toast(error.message); groupView(id); };
  for(const b of app.querySelectorAll('.da')) b.onclick = async () => { if(!confirm('Aufgabe löschen?')) return; const { error } = await sb.from('teacher_assignments').delete().eq('id', b.dataset.id); if(error) return toast(error.message); groupView(id); };

    const title = $('#at').value.trim(); if(!title) return toast('Titel fehlt');

    const { error } = await sb.from('teacher_assignments').insert(row);
    if(error) return toast(error.message);
    toast('Gesendet'); groupView(id);

    <div class="row"><span class="chip ${p.published?(p.visibility==='groups'?'':'ok'):'warn'}">${p.published?(p.visibility==='groups'?'nur Gruppen':'für alle'):'Entwurf'}</span><span class="chip">${p.exam}</span>${p.region?`<span class="meta">${esc(p.region)}</span>`:''}</div>

}

async function planEditor(id){
  app.innerHTML = `<span class="sp"></span>`;
  let p = { title:'', description:'', author_name: me.user_metadata?.full_name || me.user_metadata?.name || '', author_title:'', exam:'KP', region:null, topic_keys:[], published:false, visibility:'public' };
  if(id){ const { data, error } = await sb.from('author_plans').select().eq('id', id).single(); if(error) return app.innerHTML = `<div class="empty">${esc(error.message)}</div>`; p = data; }

  // ---- editor state -------------------------------------------------
  let exam = p.exam, region = p.region || '', published = p.published, visibility = p.visibility || 'public';
  let order = [...p.topic_keys];           // THE plan: ordered keys (manifest, FSP diagnoses, custom::…)
  let q = '';                              // catalogue search
  let dirty = false;
  const catTitle = Object.fromEntries(manifest.categories.map(c => [c.id, c.titleDe]));
  const isCustom = k => k.startsWith(CUSTOM);
  const kpKeys = () => manifest.categories.flatMap(c=>c.topics.map(t=>`${c.id}::${t.path}`));
  const fspKey = () => exam==='FSP' ? fspKeyFor(region) : null;
  const label = k => isCustom(k) ? k.slice(CUSTOM.length) : (k.includes('::') ? human(k.slice(k.indexOf('::')+2)) : k);
  const sub = k => isCustom(k) ? 'Eigenes Thema' : (k.includes('::') ? (catTitle[k.slice(0,k.indexOf('::'))] || 'KP') : `FSP · ${fspKey()||''}`);
  const has = k => order.includes(k);
  const add = k => { if(!has(k)){ order.push(k); dirty = true; } };
  const remove = k => { const i = order.indexOf(k); if(i>=0){ order.splice(i,1); dirty = true; } };
  const toggle = k => { has(k) ? remove(k) : add(k); render(); };

  document.body.classList.add('wide');
  app.innerHTML = `
    <div class="edbar">
      <button class="btn ghost" id="back">← Pläne</button>
      <div class="edtitle" id="edtitle">${esc(p.title || 'Neuer Plan')}</div>
      <span class="hint" id="savehint"></span>
      ${id?'<button class="btn sm danger" id="del">Löschen</button>':''}
      <button class="btn primary" id="save">Speichern</button>
    </div>
    <div class="ed">
      <aside class="edleft">
        <div class="card">
          <div class="lbl">Prüfung</div>
          <div class="chips" id="exam"><button data-e="KP">KP</button><button data-e="FSP">FSP</button></div>
          <p class="hint" id="examhint"></p>
          <label class="f" style="margin-top:12px"><span>Titel</span><input type="text" id="title" value="${esc(p.title)}" placeholder="z. B. KP in 8 Wochen — Innere & Chirurgie"></label>
          <label class="f"><span>Beschreibung</span><textarea id="desc" rows="2">${esc(p.description)}</textarea></label>
          <div class="two" style="gap:8px"><label class="f"><span>Autor</span><input type="text" id="an" value="${esc(p.author_name)}"></label><label class="f"><span>Titel/Position</span><input type="text" id="atitle" value="${esc(p.author_title)}" placeholder="Dr. med., Dozentin…"></label></div>
          <label class="f"><span>Bundesland</span><select id="region"><option value="">alle</option>${REGIONS.map(r=>`<option value="${r}" ${region===r||(exam==='FSP'&&region&&fspKeyFor(r)===region)?'selected':''}>${r}</option>`).join('')}</select></label>
          <div class="lbl">Sichtbarkeit</div>
          <div class="chips" id="vis"><button data-v="draft">Entwurf</button>${role==='teacher'?'<button data-v="groups">Nur meine Gruppen</button>':''}<button data-v="public">Für alle</button></div>
          <p class="hint" id="vishint"></p>
        </div>
        <div class="card">
          <div class="lbl">Eigenes Thema</div>
          <div class="row" style="flex-wrap:nowrap"><input type="text" id="ci" placeholder="z. B. Arztbrief schreiben" style="flex:1"><button class="btn" id="cadd">+ In den Plan</button></div>
          <p class="hint">Kommt als Kachel ans Ende des Plans — danach frei verschiebbar.</p>
        </div>
        <div class="card catalog">
          <div class="lbl">Katalog <span class="tr" id="catn"></span></div>
          <input type="text" id="q" placeholder="Thema suchen…" style="margin-bottom:8px">
          <div class="row" style="margin-bottom:8px;gap:6px"><button class="btn sm" id="all">Alles in den Plan</button><button class="btn sm ghost" id="collapse">Alle zuklappen</button></div>
          <div id="picker"></div>
        </div>
      </aside>
      <section class="edright">
        <div class="planhead">
          <div><div class="lbl" style="margin:0">Dein Plan <span class="tr" id="sn"></span></div><p class="hint">Kacheln ziehen = Reihenfolge. ✕ entfernt. Die Nummer ist der Lerntag-Platz.</p></div>
          <div class="row" style="gap:6px">
            <select id="sort" class="btn sm" style="padding:6px 10px"><option value="">Sortieren…</option><option value="catalog">Katalogreihenfolge</option><option value="alpha">A → Z</option><option value="shuffle">Mischen</option></select>
            <button class="btn sm ghost" id="clear">Leeren</button>
          </div>
        </div>
        <div id="plan" class="tiles"></div>
      </section>
    </div>`;

  const leave = () => { document.body.classList.remove('wide'); route('plans'); };
  $('#back').onclick = () => { if(dirty && !confirm('Ungespeicherte Änderungen verwerfen?')) return; leave(); };
  if(id) $('#del').onclick = async () => { if(!confirm('Plan wirklich löschen?')) return; const { error } = await sb.from('author_plans').delete().eq('id', id); if(error) return toast(error.message); toast('Gelöscht'); leave(); };
  $('#title').oninput = () => { $('#edtitle').textContent = $('#title').value || 'Neuer Plan'; dirty = true; };
  for(const sel of ['#desc','#an','#atitle']) $(sel).oninput = () => dirty = true;

  const setExam = e => { if(exam!==e){ exam=e; order = order.filter(k => isCustom(k) || k.includes('::')); dirty = true; } for(const b of $('#exam').querySelectorAll('button')) b.classList.toggle('on', b.dataset.e===exam); $('#examhint').textContent = exam==='FSP' ? 'FSP-Diagnosen des Bundeslands + KP-Katalog. Bundesland unten wählen.' : 'Themen aus dem KP-Katalog (Fächer → Themen).'; render(); };
  for(const b of $('#exam').querySelectorAll('button')) b.onclick = () => setExam(b.dataset.e);
  const setVis = v => { published = v!=='draft'; if(v!=='draft') visibility = v; dirty = true; for(const b of $('#vis').querySelectorAll('button')) b.classList.toggle('on', b.dataset.v===(published?visibility:'draft')); $('#vishint').textContent = !published ? 'Nur du siehst diesen Plan.' : visibility==='groups' ? 'Nicht in der öffentlichen Liste. Nur für Teilnehmer, denen du den Plan als Aufgabe schickst.' : 'Erscheint unter „Pläne von Autoren“ für alle Nutzer.'; };
  for(const b of $('#vis').querySelectorAll('button')) b.onclick = () => setVis(b.dataset.v);
  $('#region').onchange = () => { region = $('#region').value; if(exam==='FSP'){ order = order.filter(k => isCustom(k) || k.includes('::')); } dirty = true; render(); };
  $('#cadd').onclick = () => { const v=$('#ci').value.trim(); if(!v) return; add(CUSTOM+v); $('#ci').value=''; render(); $('#plan').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'}); };
  $('#ci').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); $('#cadd').click(); } };
  $('#q').oninput = () => { q = $('#q').value.trim().toLowerCase(); renderPicker(); };
  $('#all').onclick = () => { for(const k of allKeys()) add(k); render(); };
  $('#clear').onclick = () => { if(!order.length || confirm('Plan leeren?')){ order=[]; dirty=true; render(); } };
  $('#collapse').onclick = () => { for(const c of app.querySelectorAll('.cat.open')) c.classList.remove('open'); };
  $('#sort').onchange = () => {
    const v = $('#sort').value; $('#sort').value='';
    if(v==='catalog'){ const idx = new Map(allKeys().map((k,i)=>[k,i])); order.sort((a,b)=>(idx.has(a)?idx.get(a):1e9)-(idx.has(b)?idx.get(b):1e9)); }
    else if(v==='alpha'){ order.sort((a,b)=>label(a).localeCompare(label(b),'de')); }
    else if(v==='shuffle'){ for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } }
    else return;
    dirty = true; render();
  };
  function allKeys(){ const key=fspKey(); return exam==='FSP' ? (key? [...diagnosesFor(key), ...kpKeys()] : kpKeys()) : kpKeys(); }

  // ---- right: the plan as draggable tiles ----------------------------
  let openCats = new Set();
  function renderPlan(){
    $('#sn').textContent = `${order.length} Themen`;
    const el = $('#plan');
    if(!order.length){ el.innerHTML = '<div class="empty" style="grid-column:1/-1">Noch leer. Links im Katalog anklicken oder ein eigenes Thema eintippen.</div>'; return; }
    el.innerHTML = order.map((k,i)=>`<div class="tile2 ${isCustom(k)?'custom':''}" draggable="true" data-i="${i}" title="${esc(label(k))}">
        <span class="n num">${i+1}</span>
        <div class="tt"><div class="t">${esc(label(k))}</div><div class="s">${isCustom(k)?'✎ ':''}${esc(sub(k))}</div></div>
        <button class="x" data-k="${esc(k)}" title="Entfernen">✕</button></div>`).join('');
    for(const b of el.querySelectorAll('.x')) b.onclick = e => { e.stopPropagation(); remove(b.dataset.k); render(); };
    // Live reorder: while dragging, the dashed ghost moves through the
    // grid so the final position (and new numbers) is visible before drop.
    let dragEl=null, startOrder=null;
    const renumber = () => { [...el.querySelectorAll('.tile2')].forEach((t,i)=>{ const n=t.querySelector('.n'); n.textContent=i+1; n.classList.toggle('changed', startOrder && startOrder[i]!==t.dataset.k); }); };
    for(const t of el.querySelectorAll('.tile2')){
      t.dataset.k = order[+t.dataset.i];
      t.ondragstart = e => { dragEl=t; startOrder=[...order]; t.classList.add('drag'); el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', t.dataset.k); }catch(_){} };
      t.ondragover = e => { e.preventDefault(); if(!dragEl || t===dragEl) return;
        const r=t.getBoundingClientRect(); const sameRow = Math.abs(r.top - dragEl.getBoundingClientRect().top) < r.height/2;
        const after = sameRow ? (e.clientX > r.left + r.width/2) : (e.clientY > r.top + r.height/2);
        const next = after ? t.nextSibling : t;
        if(next !== dragEl && !(after && t.nextSibling===dragEl) ) el.insertBefore(dragEl, next);
        renumber(); };
      t.ondrop = e => e.preventDefault();
      t.ondragend = () => { if(!dragEl) return; dragEl.classList.remove('drag'); el.classList.remove('dragging');
        const next = [...el.querySelectorAll('.tile2')].map(x=>x.dataset.k);
        const changed = next.some((k,i)=>k!==order[i]);
        dragEl=null; startOrder=null;
        if(changed){ order = next; dirty = true; }
        render(); };
    }
    el.ondragover = e => e.preventDefault();
  }
  // ---- left: catalogue -------------------------------------------------
  function renderPicker(){
    const pk = $('#picker'); const key = fspKey(); const sel = new Set(order);
    const match = (txt) => !q || txt.toLowerCase().includes(q);
    let total = 0, html = '';
    if(exam==='FSP'){
      if(!key) html += '<p class="hint">Bitte zuerst ein Bundesland wählen — die FSP-Diagnosen hängen davon ab.</p>';
      else { const ds = diagnosesFor(key).filter(match); total += ds.length; const n = ds.filter(d=>sel.has(d)).length;
        html += `<div class="cat ${q||openCats.has('__fsp')?'open':''}" data-c="__fsp"><div class="h"><span>FSP · ${esc(key)}</span><span class="n num">${n}/${ds.length}</span><input type="checkbox" class="ca" data-c="__fsp" ${ds.length&&n===ds.length?'checked':''} data-part="${(n>0&&n<ds.length)?1:0}"></div>
          <div class="b">${ds.map(d=>`<label class="${sel.has(d)?'on':''}"><input type="checkbox" data-k="${esc(d)}" ${sel.has(d)?'checked':''}>${esc(d)}</label>`).join('')}</div></div>`; }
    }
    for(const c of manifest.categories){
      const topics = c.topics.filter(t=>match(human(t.path))||match(c.titleDe)); if(!topics.length) continue;
      const keys = topics.map(t=>`${c.id}::${t.path}`); const n = keys.filter(k=>sel.has(k)).length; total += keys.length;
      html += `<div class="cat ${q||openCats.has(c.id)?'open':''}" data-c="${c.id}"><div class="h"><span>${esc(c.titleDe)}</span><span class="n num">${n}/${keys.length}</span><input type="checkbox" class="ca" data-c="${c.id}" ${n===keys.length?'checked':''} data-part="${(n>0&&n<keys.length)?1:0}" title="Ganze Kategorie"></div>
        <div class="b">${topics.map(t=>{ const k=`${c.id}::${t.path}`; return `<label class="${sel.has(k)?'on':''}"><input type="checkbox" data-k="${k}" ${sel.has(k)?'checked':''}>${esc(human(t.path))}</label>`; }).join('')}</div></div>`;
    }
    pk.innerHTML = html || '<p class="hint">Nichts gefunden.</p>';
    $('#catn').textContent = `${total}`;
    for(const h of pk.querySelectorAll('.cat>.h')) h.onclick = e => { if(e.target.closest('.ca')) return; const c=h.parentElement; c.classList.toggle('open'); c.classList.contains('open') ? openCats.add(c.dataset.c) : openCats.delete(c.dataset.c); };
    for(const b of pk.querySelectorAll('.ca')){ b.indeterminate = b.dataset.part==='1'; b.onclick = e => { e.stopPropagation();
      const keys = b.dataset.c==='__fsp' ? diagnosesFor(key) : manifest.categories.find(x=>x.id===b.dataset.c).topics.map(t=>`${b.dataset.c}::${t.path}`);
      const allIn = keys.every(k=>sel.has(k)); if(allIn){ for(const k of keys) remove(k); } else { for(const k of keys) add(k); } render(); }; }
    for(const cb of pk.querySelectorAll('input[data-k]')) cb.onchange = () => toggle(cb.dataset.k);
  }
  function render(){ renderPicker(); renderPlan(); }
  setExam(exam); setVis(published ? visibility : 'draft'); dirty = false;

  $('#save').onclick = async () => {
    const title = $('#title').value.trim(); if(!title) return toast('Titel fehlt');
    if(exam==='FSP' && !fspKey()) return toast('FSP: Bundesland wählen');
    if(!order.length) return toast('Der Plan ist leer');
    const row = { author_id: me.id, title, description: $('#desc').value.trim(), author_name: $('#an').value.trim(), author_title: $('#atitle').value.trim(), exam,
      region: exam==='FSP' ? fspKey() : (region || null), topic_keys: order, published, visibility };
    $('#save').disabled = true; $('#savehint').textContent = 'Speichern…';
    const qq = id ? sb.from('author_plans').update(row).eq('id', id).select().single() : sb.from('author_plans').insert(row).select().single();
    const { data, error } = await qq;
    $('#save').disabled = false; $('#savehint').textContent = '';
    if(error) return toast(`Fehler: ${error.message}`);
    dirty = false; toast('Gespeichert');
    if(!id){ id = data.id; history.replaceState(null,'',location.pathname); $('#edbar') ; }
  };
}

sb.auth.onAuthStateChange((ev) => { if(ev==='SIGNED_OUT') loginView(); });
boot();
</script>
</body>
</html>
